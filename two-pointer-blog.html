<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Pointer</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #1a1a1a;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.8;
    padding: 48px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap { width: 100%; max-width: 680px; }

  h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }

  p[data-ke-size="size16"] {
    font-size: 15px;
    color: #333;
    margin-bottom: 2px;
    white-space: pre-wrap;
  }

  .hl {
    background: #f6e199;
    color: #1a1a1a;
    padding: 0 2px;
    border-radius: 2px;
  }

  /* ── 데모 카드 (다크) ── */
  :root {
    --surface2: #1e2128;
    --border: #2a2d35;
    --text-d: #e8eaf0;
    --muted: #7a7f8e;
    --blue: #4f8ef7;
    --blue-dim: rgba(79,142,247,0.12);
    --red: #f76f6f;
    --red-dim: rgba(247,111,111,0.12);
    --green: #4fd4a0;
    --yellow: #f7c94f;
    --mono: 'JetBrains Mono', monospace;
  }

  .demo-wrap {
    margin: 28px 0 32px;
    background: #16181c;
    border-radius: 14px;
    padding: 24px 24px 20px;
    color: var(--text-d);
  }

  .demo-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--blue);
    background: var(--blue-dim);
    border: 1px solid rgba(79,142,247,.25);
    border-radius: 4px;
    display: inline-block;
    padding: 2px 9px;
    margin-bottom: 14px;
  }

  .demo-desc {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 18px;
    font-family: var(--mono);
  }

  .target-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .target-row label { font-size: 13px; color: var(--muted); font-family: var(--mono); }
  .target-row input {
    font-family: var(--mono); font-size: 14px; width: 70px;
    padding: 5px 10px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-d); outline: none;
  }
  .target-row input:focus { border-color: var(--blue); }

  .array-row { display: flex; align-items: center; gap: 6px; }
  .cell {
    width: 50px; height: 50px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 17px; font-weight: 600;
    color: var(--text-d); flex-shrink: 0; transition: all .25s;
  }
  .cell.active-l { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .cell.active-r { background: var(--red-dim);  border-color: var(--red);  color: var(--red);  box-shadow: 0 0 0 1px var(--red); }

  .pointer-row { display: flex; gap: 6px; margin-top: 5px; height: 26px; align-items: flex-start; }
  .ptr-slot { width: 50px; flex-shrink: 0; display: flex; justify-content: center; }
  .ptr { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .ptr-l { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(79,142,247,.3); }
  .ptr-r { background: var(--red-dim);  color: var(--red);  border: 1px solid rgba(247,111,111,.3); }

  .controls { margin-top: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-d); cursor: pointer;
    transition: all .15s; letter-spacing: .04em;
  }
  .btn:hover { border-color: var(--muted); background: #24272f; }
  .btn.primary { background: var(--blue-dim); border-color: rgba(79,142,247,.4); color: var(--blue); }
  .btn.primary:hover { background: rgba(79,142,247,.2); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .status-box {
    margin-top: 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-family: var(--mono);
    font-size: 12px; color: var(--muted); min-height: 40px; line-height: 1.6;
  }
  .status-box .hi  { color: var(--yellow); }
  .status-box .ok  { color: var(--green); }
  .status-box .bad { color: var(--red); }

  .found-anim {
    font-family: var(--mono); font-size: 12px; padding: 3px 10px; border-radius: 4px;
    background: rgba(79,212,160,.15); color: var(--green);
    border: 1px solid rgba(79,212,160,.3);
    animation: pop .3s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- 인터랙티브 데모 -->
  <div class="demo-wrap">
    <div class="demo-label">Interactive</div>
    <div class="demo-desc">target 값을 바꾸고 step을 눌러 포인터 이동을 직접 확인해보세요.</div>

    <div class="target-row">
      <label>target =</label>
      <input type="number" id="p1-target" value="10" min="2" max="20">
      <button class="btn primary" onclick="p1Reset()">reset</button>
    </div>

    <div id="p1-array"><div class="array-row"></div></div>
    <div class="pointer-row" id="p1-ptrs"></div>

    <div class="controls">
      <button class="btn" id="p1-step" onclick="p1Step()">step →</button>
      <button class="btn" onclick="p1Auto()" id="p1-auto">auto play</button>
      <span id="p1-found"></span>
    </div>
    <div class="status-box" id="p1-status">시작 준비 완료. step 버튼을 눌러보세요.</div>
  </div>

  <p data-ke-size="size16">&nbsp;</p>
  <p data-ke-size="size16">&nbsp;</p>
  <p data-ke-size="size16">&nbsp;</p>
  <p data-ke-size="size16">&nbsp;</p>

</div>
<script>
const p1Arr = [1, 2, 4, 5, 7, 8, 9];
let p1L, p1R, p1Done;

function p1Reset() {
  p1L = 0; p1R = p1Arr.length - 1; p1Done = false;
  document.getElementById('p1-found').innerHTML = '';
  document.getElementById('p1-step').disabled = false;
  p1Render('시작 준비 완료. step 버튼을 눌러보세요.');
}

function p1Render(msg) {
  document.getElementById('p1-array').innerHTML = '<div class="array-row">' +
    p1Arr.map((v, i) => {
      let cls = 'cell';
      if (i === p1L) cls += ' active-l';
      else if (i === p1R) cls += ' active-r';
      return `<div class="${cls}">${v}</div>`;
    }).join('') + '</div>';
  document.getElementById('p1-ptrs').innerHTML = p1Arr.map((_, i) => {
    let label = '';
    if (i === p1L && i === p1R) label = `<span class="ptr ptr-l">L=R</span>`;
    else if (i === p1L) label = `<span class="ptr ptr-l">L</span>`;
    else if (i === p1R) label = `<span class="ptr ptr-r">R</span>`;
    return `<div class="ptr-slot">${label}</div>`;
  }).join('');
  document.getElementById('p1-status').innerHTML = msg;
}

function p1Step() {
  const target = parseInt(document.getElementById('p1-target').value);
  if (p1Done || p1L >= p1R) {
    p1Render(`<span class="bad">탐색 완료 — 해당 합을 가진 쌍을 찾지 못했습니다.</span>`);
    document.getElementById('p1-step').disabled = true;
    return;
  }
  const sum = p1Arr[p1L] + p1Arr[p1R];
  if (sum === target) {
    p1Done = true;
    document.getElementById('p1-step').disabled = true;
    document.getElementById('p1-found').innerHTML = `<span class="found-anim">✓ 발견!</span>`;
    p1Render(`<span class="ok">정답 발견! arr[${p1L}] + arr[${p1R}] = ${p1Arr[p1L]} + ${p1Arr[p1R]} = ${sum} == target</span>`);
  } else if (sum < target) {
    const msg = `<span class="hi">sum = ${p1Arr[p1L]} + ${p1Arr[p1R]} = ${sum} &lt; ${target}</span> → L++ (${p1L} → ${p1L+1})`;
    p1L++;
    p1Render(msg);
  } else {
    const msg = `<span class="hi">sum = ${p1Arr[p1L]} + ${p1Arr[p1R]} = ${sum} &gt; ${target}</span> → R-- (${p1R} → ${p1R-1})`;
    p1R--;
    p1Render(msg);
  }
  if (!p1Done && p1L >= p1R) document.getElementById('p1-step').disabled = true;
}

let p1Timer;
function p1Auto() {
  if (p1Timer) { clearInterval(p1Timer); p1Timer = null; document.getElementById('p1-auto').textContent = 'auto play'; return; }
  document.getElementById('p1-auto').textContent = 'stop';
  p1Timer = setInterval(() => {
    if (p1Done || p1L >= p1R) { clearInterval(p1Timer); p1Timer = null; document.getElementById('p1-auto').textContent = 'auto play'; return; }
    p1Step();
  }, 900);
}

p1Reset();
</script>
</body>
</html>
